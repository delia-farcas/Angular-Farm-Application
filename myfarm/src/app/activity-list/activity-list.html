<div class="activity-container">
  <!-- Secțiune Alerte -->
  <div class="table-section">
    <h3 class="section-title alert-text">🚨 Alerte Securitate</h3>
    <div class="table-container">
      <table class="users-table">
        <thead>
          <tr>
            <th>User ID</th>
            <th>Violare</th>
            <th>Risc</th>
            <th>Acțiune</th>
          </tr>
        </thead>
        <tbody>
          @for (obs of observations; track obs.id) {
            <tr app-activity-row [data]="obs" [type]="'observation'" (resolve)="resolveObservation($event)"></tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <!-- Secțiune Log-uri -->
  <div class="table-section">
    <h3 class="section-title">📜 Istoric Log-uri</h3>
    <div class="table-container scrollable">
      <table class="users-table">
        <thead>
          <tr>
            <th>Dată</th>
            <th>IP</th>
            <th>Acțiune</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          @for (log of logs; track log.id) {
            <tr app-activity-row [data]="log" [type]="'log'"></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
