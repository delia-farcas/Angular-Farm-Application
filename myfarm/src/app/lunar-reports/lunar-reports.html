<div class="page">
  <h1 class="title">Raport Lunar</h1>

  <div class="filters">
    <div class="filter-group">
      <span class="label">categorii de produse</span>
      <div class="dropdown-wrapper">
        <select [ngModel]="category" class="dropdown" (ngModelChange)="onCategoryChange($event)">
          <option value="lapte">lapte</option>
          <option value="oua">ouă</option>
          <option value="lana">lână</option>
          <option value="ore_munca">ore muncă</option>
          <option value="carne">carne</option>
        </select>
      </div>
    </div>

    <div class="filter-group">
      <span class="label">animal</span>
      <div class="animal-select">
        <button type="button" class="animal-select-button" (click)="toggleAnimalSelect()">
          <img *ngIf="selectedAnimal" [src]="selectedAnimal.icon" [alt]="selectedAnimal.name" />
          <span>{{ selectedAnimal?.name }}</span>
        </button>
        <div *ngIf="isAnimalSelectOpen" class="animal-options">
          <button
            type="button"
            *ngFor="let a of animals"
            class="animal-option"
            (click)="selectAnimal(a)"
          >
            <img [src]="a.icon" [alt]="a.name" />
            <span>{{ a.name }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  @if (view === 'table') {
    <div class="table-container">
      <table class="data-table" id="data-table">
        <thead>
          <tr>
            <th>Săptămâna</th>
            <th>{{ selectedAnimal?.name }} ({{ unit }})</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of tableRows">
            <td>{{ row.label }}</td>
            <td>{{ row.total }}</td>
          </tr>
          <tr class="total-row">
            <td>Total</td>
            <td>{{ total }}</td>
          </tr>
        </tbody>
      </table>

      <div style="background: #fff; border-radius: 14px; padding: 16px">
        <canvas baseChart [type]="'line'" [data]="chartData" [options]="chartOptions"> </canvas>
      </div>
    </div>
  } @else {
    <div style="background: #fff; border-radius: 14px; padding: 16px">
      <canvas baseChart [type]="'line'" [data]="chartData" [options]="chartOptions"> </canvas>
    </div>
  }

  <div class="toggles-container">
    <div class="view-toggle">
      <span class="label">tabel</span>
      <label class="switch" for="view-switch">
        <input
          type="checkbox"
          id="view-switch"
          class="switch-input"
          [checked]="view === 'chart'"
          (change)="onToggleView($event)"
        />
        <span class="switch-track">
          <span class="switch-knob"></span>
        </span>
      </label>
      <span class="label">grafic</span>
    </div>
  </div>
</div>
